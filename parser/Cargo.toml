[package]
authors = ["Eric Scouten <git@scouten.me>"]
categories = ["parser-implementations"]
description = "Parser for AsciiDoc format"
documentation = "https://docs.rs/asciidoc-parser"
edition = "2024"
keywords = ["asciidoc", "parser"]
license = "MIT OR Apache-2.0"
name = "asciidoc-parser"
readme = "../README.md"
repository = "https://github.com/asciidoc-rs/asciidoc-parser"
rust-version = "1.88.0"
version = "0.30.1"

[dependencies]
ahash = "0.8.12"
bytecount = "0.6.7"
memchr = "2.6.4"
percent-encoding = "2.3.2"
regex = "1.11.1"
# Exactly the features `regex` itself enables on the shared build (its
# defaults plus what this crate's use of `meta::Regex` needs, which is the
# same set): anything beyond them — notably `dfa-build`/`dfa-search` from the
# default `dfa` feature — would, through feature unification, change engine
# selection for every `regex::Regex` in this crate, not just the quote subs.
regex-automata = { version = "0.4.18", default-features = false, features = [
  "dfa-onepass",
  "hybrid",
  "meta",
  "nfa-backtrack",
  "nfa-pikevm",
  "perf-inline",
  "perf-literal",
  "std",
  "syntax",
  "unicode",
] }
self_cell = "1.2.0"
thiserror = "2.0.1"

[dev-dependencies]
codspeed-criterion-compat = "5.0.1"
criterion = "0.8.2"
pretty_assertions_sorted = "1.2.3"

[[bench]]
harness = false
name = "element_attributes"

[[bench]]
harness = false
name = "inline_macro"

[[bench]]
harness = false
name = "inline_throughput"

[[bench]]
harness = false
name = "repeated_delimiters"

[[bench]]
harness = false
name = "section_with_two_blocks"

[[bench]]
harness = false
name = "simple_parse"

[package.metadata.cargo-udeps.ignore]
development = ["criterion"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }
